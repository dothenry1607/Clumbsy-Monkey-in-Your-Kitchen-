<script>
const $=s=>document.querySelector(s),S=$('#S');

const m2f=n=>440*2**((n-69)/12),PE=[72,74,76,79,81,84].map(m2f);
function nt(f,t,d,v,dest,ty='sine',h=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);
if(h){const o2=ac.createOscillator(),g2=ac.createGain();o2.frequency.value=f*h;g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(v*.3,t+.005);g2.gain.exponentialRampToValueAtTime(.0001,t+d*.3);o2.connect(g2);g2.connect(dest);o2.start(t);o2.stop(t+d*.3+.05)}}

const CH=[{b:[36,40,43,45],c:[59,62,64,67],s:[72,74,76,79,81,83]},{b:[33,37,40,43],c:[55,61,64,67],s:[69,71,73,76,79,81]},{b:[38,41,45,47],c:[60,64,65,69],s:[74,76,77,81,84]},{b:[43,47,50,48],c:[59,62,65,67],s:[67,71,74,77,79,83]}];
function sched(){if(!ac||!mOn)return;while(nxt<ac.currentTime+.5){const c=CH[bn%4],Q=.56;
for(let k=0;k<4;k++){const t=nxt+k*Q;nt(m2f(c.b[k]),t,Q*.95,.22,bassB,'triangle');ns(t,.06,.02,'highpass',7500,mG);if(k%2)ns(t+Q*.67,.06,.03,'highpass',7500,mG);
if(Math.random()<.5)nt(m2f(c.s[Math.random()*c.s.length|0]),t+(Math.random()<.4?Q*.67:0),.8,.05,keysB,'sine',4)}
[0,1.67].forEach(o=>c.c.forEach(n=>nt(m2f(n),nxt+o*Q,.4,.035,keysB,'sine',3)));nxt+=4*Q;bn++}}
function music(){clearInterval(mt);if(!ac)return;mG.gain.value=mOn?.5:0;if(!mOn)return;nxt=ac.currentTime+.1;mt=setInterval(sched,150);sched()}
function wake(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
mG=ac.createGain();sG=ac.createGain();sG.gain.value=.9;mG.connect(ac.destination);sG.connect(ac.destination);
nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
bassB=ac.createBiquadFilter();bassB.type='lowpass';bassB.frequency.value=380;bassB.connect(mG);
keysB=ac.createBiquadFilter();keysB.type='lowpass';keysB.frequency.value=2400;keysB.connect(mG);
const dl=ac.createDelay(),fb=ac.createGain();dl.delayTime.value=.22;fb.gain.value=.28;keysB.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(mG);music()}
if(ac.state=='suspended')ac.resume()}
function pop(){if(!ac)return;const t=ac.currentTime;if(t-lp<.07)return;lp=t;nt(PE[pi++%6],t,.25,.09,sG,'sine',4)}
const ok=()=>{if(!ac)return;const t=ac.currentTime;nt(m2f(79),t,.5,.1,sG,'sine',4);nt(m2f(84),t+.12,.8,.1,sG,'sine',4)},
bad=()=>{if(ac)nt(m2f(50),ac.currentTime,.2,.1,sG)},
crackS=()=>{if(!ac)return;const t=ac.currentTime;ns(t,.07,.25,'bandpass',2200,sG);nt(140,t,.12,.15,sG)},
pour=()=>{if(ac)ns(ac.currentTime,.16,.06,'bandpass',900,sG)},
swsh=b=>{if(ac)ns(ac.currentTime,b?.4:.15,.05,'bandpass',b?1800:2600,sG)},
beep=()=>{if(!ac)return;const t=ac.currentTime;nt(m2f(91),t,.09,.07,sG);nt(m2f(91),t+.12,.09,.07,sG)};
function fan(){if(!ac)return;const t=ac.currentTime+.1;[72,76,79,81,84].forEach((n,i)=>nt(m2f(n),t+i*.11,.6,.11,sG,'sine',4));[72,76,79,81,86].forEach(n=>nt(m2f(n),t+.7,2,.08,sG,'sine',3));[48,55].forEach(n=>nt(m2f(n),t+.7,1.8,.15,sG,'triangle'));ns(t+.7,1.2,.07,'highpass',5000,sG);for(let i=0;i<45;i++)ns(t+.9+Math.random()*1.8,.03,.08,'bandpass',1800+Math.random()*3500,sG)}

'🔥':sv('<path d="M50 6Q72 30 78 54Q84 86 50 94Q16 86 22 54Q26 38 38 24Q40 40 50 44Q58 28 50 6Z" fill="#EC008C"/><path d="M50 50Q64 66 62 78Q58 90 50 90Q40 90 38 78Q38 64 50 50Z" fill="#FFD93F"/>'),

'🍫':sv('<rect x="22" y="8" width="56" height="84" rx="8" fill="#6B3A1E"/><path d="M22 36H78M22 64H78M50 8V92" fill="none" stroke-width="3"/>'),
'dough':sv('<circle cx="50" cy="52" r="36" fill="#F1D9A8"/><circle cx="38" cy="42" r="5" fill="#6B3A1E" stroke="none"/><circle cx="60" cy="38" r="5" fill="#6B3A1E" stroke="none"/><circle cx="56" cy="62" r="5" fill="#6B3A1E" stroke="none"/><circle cx="36" cy="64" r="4" fill="#6B3A1E" stroke="none"/>'),

'base0':pz(0),'base1':pz(1),'base2':pz(2),'pizzaw':pz(3),
'🍕':sv('<path d="M50 92L10 24Q50 4 90 24Z" fill="#FFD93F"/><path d="M10 24Q50 4 90 24" fill="none" stroke="#C9791F" stroke-width="9"/><circle cx="40" cy="38" r="6" fill="#EC008C" stroke-width="3"/><circle cx="60" cy="40" r="6" fill="#EC008C" stroke-width="3"/><circle cx="50" cy="62" r="6" fill="#EC008C" stroke-width="3"/>'),
'🍪':sv('<circle cx="50" cy="50" r="40" fill="#C98A4B"/><circle cx="36" cy="38" r="5" fill="#000" stroke="none"/><circle cx="62" cy="34" r="5" fill="#000" stroke="none"/><circle cx="56" cy="60" r="5" fill="#000" stroke="none"/><circle cx="34" cy="64" r="5" fill="#000" stroke="none"/>')};
const G=k=>ART[String(k).replace(/\uFE0F/g,'')],art=(d,k)=>{const a=G(k);if(a)d.innerHTML=a;else d.textContent=k};
document.querySelectorAll('[data-a]').forEach(n=>n.insertAdjacentHTML('afterbegin',n.dataset.a.split(',').map(G).join('')));
// ---------- helpers ----------
const show=id=>{document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id))};
$('#ttl').innerHTML='Clumsy Monkey in Your Kitchen'.split('').map(c=>c==' '?' ':`<span>${c}</span>`).join('');
const stars=()=>{let n=0;try{n=+localStorage.getItem('cmk')||0}catch(e){}$('#stars').textContent=n?'Dishes cooked: '+n:''};stars();
function el(e,x,y,s,cls=''){const d=document.createElement('div');d.className='it '+cls;art(d,e);d.style.left=x+'%';d.style.top=y+'%';d.style.fontSize=`calc(var(--u)*${s})`;S.appendChild(d);return d}

// ---------- shapes (return px points) ----------
const lerp=(a,n=10)=>{const o=[];for(let i=0;i<a.length-1;i++)for(let j=0;j<n;j++)o.push([a[i][0]+(a[i+1][0]-a[i][0])*j/n,a[i][1]+(a[i+1][1]-a[i][1])*j/n]);o.push(a[a.length-1]);return o};
const poly=a=>(W,H)=>{const s=Math.min(W,H)*.62;return lerp(a).map(p=>[W/2+(p[0]-.5)*s,H/2+(p[1]-.5)*s])};
const cut=poly([[0,.5],[1,.5]]),dia=poly([[.5,.05],[.95,.5],[.5,.95],[.05,.5],[.5,.05]]),box=poly([[.2,.1],[.8,.1],[.8,.9],[.2,.9],[.2,.1]]),tri=poly([[.5,.05],[.95,.9],[.05,.9],[.5,.05]]);
