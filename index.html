<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clumsy Monkey HUD</title>
    <style>
      :root {
        --bg: #efefef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        font-family: Arial, sans-serif;
      }

      canvas {
        display: block;
        background: var(--bg);
        max-width: 100vw;
        height: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1400" height="820"></canvas>
    <script src="game.js"></script>
  </body>
</html>
